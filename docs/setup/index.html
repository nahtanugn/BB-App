<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BB App Company Setup</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102a43;background:#edf3f8}*{box-sizing:border-box}body{margin:0;padding:clamp(12px,4vw,42px)}button,input,select{font:inherit}main{width:min(100%,820px);margin:auto}.card{overflow:hidden;border:1px solid #d7e2ed;border-radius:26px;background:#fff;box-shadow:0 24px 70px rgba(8,52,95,.1)}header{padding:clamp(20px,5vw,38px);display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #d7e2ed}.brand{display:flex;align-items:center;gap:14px}.brand img{width:58px;height:58px;padding:5px;border:1px solid #d7e2ed;border-radius:15px;object-fit:contain}.eyebrow{margin:0 0 5px;color:#1674d1;font-size:11px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}.brand strong{display:block;color:#08345f}select{min-height:44px;padding:0 11px;border:1px solid #bdcddd;border-radius:11px;background:#fff;color:#102a43}.intro{padding:clamp(26px,6vw,48px) clamp(20px,6vw,52px) 22px}.intro h1{margin:5px 0 10px;color:#08345f;font:700 clamp(34px,7vw,54px)/1.04 Georgia,serif}.intro p:last-child,.stage>p{color:#607086;line-height:1.55}.progress{margin:0 clamp(20px,6vw,52px);padding:0 0 28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));list-style:none;border-bottom:1px solid #d7e2ed}.progress li{position:relative;display:grid;justify-items:center;gap:7px;color:#8191a1;text-align:center}.progress li:before{content:"";position:absolute;top:16px;left:-50%;width:100%;height:2px;background:#dce5ed}.progress li:first-child:before{display:none}.progress li.active:before,.progress li.done:before{background:#4390d9}.progress span{position:relative;z-index:1;width:34px;height:34px;display:grid;place-items:center;border:2px solid #dce5ed;border-radius:50%;background:#fff;font-size:12px;font-weight:850}.progress li.active span{border-color:#1674d1;background:#1674d1;color:#fff;box-shadow:0 0 0 5px #e5f2fd}.progress li.done span{border-color:#26825d;background:#e6f6ee;color:#1f7553}.progress small{font-size:12px;font-weight:750}.stage{padding:30px clamp(20px,6vw,52px) 48px}.stage h2{margin:4px 0 9px;color:#08345f;font:700 clamp(27px,5vw,38px)/1.15 Georgia,serif}.stage label{display:grid;gap:7px;margin:22px 0 0;color:#08345f;font-weight:750}.stage label small{color:#64748b;font-weight:500}.field-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px}.field-row input,input[type=url]{width:100%;min-width:0;min-height:54px;padding:0 14px;border:1px solid #b9cad9;border-radius:12px;background:#fff;color:#102a43;font-size:16px}.field-row button{min-height:54px;margin:0}.secret input{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}.actions{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}button,.button{min-height:52px;padding:0 19px;border:0;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:#1674d1;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}.actions>.primary{flex:1 1 260px}.secondary{color:#08345f!important;background:#eaf3fc!important}.outline{color:#1674d1!important;background:#fff!important;border:1px solid #bdd0e1!important}.copy{min-width:92px;color:#08345f;background:#eaf3fc}.status{margin:18px 0 0;padding:15px 17px;border-radius:12px;background:#f1f5f9;color:#52657a;font-weight:700;line-height:1.5}.status.checking{color:#155a94;background:#edf6ff}.status.ok{color:#0b6949;background:#eaf8f1}.status.warning{color:#936000;background:#fff7dc}.status.error{color:#ad2929;background:#fff0f0}.ready-actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px}.ready-actions>*{flex:1 1 210px}.technical{margin-top:24px;border:1px solid #d8e3ed;border-radius:12px;background:#f8fbfe}.technical summary{padding:14px 16px;color:#38536d;font-weight:750;cursor:pointer}.technical div{padding:0 16px 16px;color:#5c7084;line-height:1.55}.safety{margin:16px clamp(20px,6vw,52px) 32px;padding:15px 17px;border-left:5px solid #e6b82f;border-radius:11px;background:#fff9e8;color:#52657a;line-height:1.5}.footer{margin-top:14px;text-align:center;color:#708195;font-size:13px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}@media(max-width:600px){body{padding:0}.card{min-height:100vh;border:0;border-radius:0}header{padding:16px 18px}.brand img{width:46px;height:46px}.intro{padding:27px 20px 20px}.progress{margin-inline:20px}.progress small{font-size:10px}.stage{padding:27px 20px 42px}.field-row{grid-template-columns:1fr}.field-row button,.actions>*,.ready-actions>*{width:100%}.safety{margin-inline:20px}select{max-width:145px}}
  </style>
</head>
<body>
<main>
  <section class="card">
    <header><div class="brand"><img src="default-bb-logo.png" onerror="this.src='https://raw.githubusercontent.com/nahtanugn/BB-App/main/public/default-bb-logo.png'" alt="Boys’ Brigade emblem"><div><p class="eyebrow">BB GUIDE</p><strong>BB App</strong></div></div><label class="sr-only" for="language">Language</label><select id="language"><option value="en">English</option><option value="zh">中文</option><option value="ms">Bahasa Malaysia</option></select></header>
    <div class="intro"><p class="eyebrow" id="journey-label"></p><h1 id="title"></h1><p id="intro"></p></div>
    <ol class="progress" id="progress"></ol>
    <section class="stage" id="stage"></section>
    <p class="safety" id="safety"></p>
  </section>
  <p class="footer" id="footer"></p>
</main>
<script>
const DEPLOY="https://deploy.workers.cloudflare.com/?url=https://github.com/nahtanugn/BB-App";
const SESSION_KEY="bb-app-setup-session-v2",LANGUAGE_KEY="bb-app-setup-language";
const translations={
en:{journey:"New company setup",title:"Set up BB App in three stages",intro:"Your company receives its own private app and database. No company records are stored in this guide or copied to the generic repository.",stages:["Deploy company app","Create administrator","Finish company setup"],safety:"Keep the setup code private. This page stores it only for this browser session and clears it after the first administrator is created.",footer:"Each company owns and controls its Cloudflare account, GitHub repository and company records.",email:"First administrator email",emailHelp:"Use the exact email that will create the first administrator.",code:"Secure setup code",generate:"Generate new code",show:"Show",hide:"Hide",copy:"Copy",copied:"Copied",deploy:"Open Cloudflare deployment",stage1Title:"Deploy your company app",stage1Text:"Enter the first administrator’s email. This page will generate a private one-time setup code, then open the free Cloudflare deployment.",technical:"Technical details",technicalText:"In Cloudflare, set ADMIN_EMAIL to the email above and SETUP_TOKEN to the generated code. Keep the D1 binding named DB. Wait for the deployment build to finish.",url:"New company app address",urlHelp:"Paste the workers.dev address shown after deployment.",urlPlaceholder:"https://your-company.workers.dev",check:"Check deployment",checking:"Checking your deployment…",building:"The app is not reachable yet. The deployment may still be building; wait a minute and check again.",database:"The app is online, but its database is unavailable. Open Cloudflare deployment details and confirm the DB binding and migrations succeeded.",ready:"Your app is ready for its first administrator.",configured:"The first administrator already exists. The private setup code has been cleared.",invalid:"Enter a valid HTTPS workers.dev address.",copyCode:"Copy setup code",openApp:"Open company app",created:"I created the administrator",stage2Title:"Create the first administrator",stage2Text:"Check the deployment, then open your company app. Enter your name, the authorised email, a password and the setup code once.",stage3Title:"Finish company setup",stage3Text:"Return here after creating the administrator. We will confirm the one-time setup is complete and clear the code from this browser session.",confirm:"Confirm administrator created",finishReady:"Administrator creation is confirmed. Open BB App to accept privacy, name the company and take the short tour. Schools, a first Officer and sharing the address can be completed later.",restart:"Start another company setup"},
zh:{journey:"新连队设置",title:"三个阶段设置 BB App",intro:"您的连队将拥有独立的私人应用及数据库。本指南不会储存连队记录，也不会把资料复制到通用仓库。",stages:["部署连队应用","创建管理员","完成连队设置"],safety:"请妥善保管设置代码。本页只会在当前浏览器会话中保存代码，并在第一位管理员创建后清除。",footer:"每个连队自行拥有和管理 Cloudflare 账号、GitHub 仓库及连队记录。",email:"第一位管理员电邮",emailHelp:"请输入将创建第一位管理员的准确电邮。",code:"安全设置代码",generate:"生成新代码",show:"显示",hide:"隐藏",copy:"复制",copied:"已复制",deploy:"打开 Cloudflare 部署",stage1Title:"部署您的连队应用",stage1Text:"输入第一位管理员的电邮。本页将生成一次性私人设置代码，然后打开免费的 Cloudflare 部署。",technical:"技术资料",technicalText:"在 Cloudflare 中，把 ADMIN_EMAIL 设为以上电邮，把 SETUP_TOKEN 设为生成的代码。D1 绑定名称保留为 DB，并等待部署完成。",url:"新连队应用地址",urlHelp:"粘贴部署后显示的 workers.dev 地址。",urlPlaceholder:"https://your-company.workers.dev",check:"检查部署",checking:"正在检查部署……",building:"暂时无法连接应用。部署可能仍在构建，请稍等一分钟后重试。",database:"应用已上线，但数据库不可用。请打开 Cloudflare 部署详情，确认 DB 绑定和迁移成功。",ready:"应用已经可以创建第一位管理员。",configured:"第一位管理员已经存在，私人设置代码已清除。",invalid:"请输入有效的 HTTPS workers.dev 地址。",copyCode:"复制设置代码",openApp:"打开连队应用",created:"我已创建管理员",stage2Title:"创建第一位管理员",stage2Text:"检查部署后打开连队应用。输入姓名、获授权电邮、密码及一次性设置代码。",stage3Title:"完成连队设置",stage3Text:"创建管理员后回到此处。我们会确认一次性设置已经完成，并清除此浏览器会话中的代码。",confirm:"确认管理员已创建",finishReady:"管理员创建已确认。打开 BB App 接受隐私声明、填写连队名称并完成简短导览。学校、第一位军官及分享地址可以稍后完成。",restart:"设置另一个连队"},
ms:{journey:"Persediaan kompeni baharu",title:"Sediakan BB App dalam tiga peringkat",intro:"Kompeni anda menerima aplikasi dan pangkalan data persendirian. Tiada rekod kompeni disimpan dalam panduan ini atau disalin ke repositori generik.",stages:["Pasang aplikasi kompeni","Cipta pentadbir","Lengkapkan persediaan"],safety:"Rahsiakan kod persediaan. Halaman ini menyimpannya hanya untuk sesi pelayar semasa dan memadamkannya selepas pentadbir pertama dicipta.",footer:"Setiap kompeni memiliki dan mengawal akaun Cloudflare, repositori GitHub dan rekodnya sendiri.",email:"E-mel pentadbir pertama",emailHelp:"Gunakan e-mel tepat yang akan mencipta pentadbir pertama.",code:"Kod persediaan selamat",generate:"Jana kod baharu",show:"Tunjuk",hide:"Sembunyi",copy:"Salin",copied:"Disalin",deploy:"Buka pemasangan Cloudflare",stage1Title:"Pasang aplikasi kompeni",stage1Text:"Masukkan e-mel pentadbir pertama. Halaman ini akan menjana kod persediaan sekali guna dan membuka pemasangan Cloudflare percuma.",technical:"Butiran teknikal",technicalText:"Dalam Cloudflare, tetapkan ADMIN_EMAIL kepada e-mel di atas dan SETUP_TOKEN kepada kod yang dijana. Kekalkan nama ikatan D1 sebagai DB dan tunggu sehingga pemasangan selesai.",url:"Alamat aplikasi kompeni baharu",urlHelp:"Tampal alamat workers.dev yang ditunjukkan selepas pemasangan.",urlPlaceholder:"https://your-company.workers.dev",check:"Semak pemasangan",checking:"Menyemak pemasangan…",building:"Aplikasi belum dapat dicapai. Pemasangan mungkin masih dibina; tunggu seminit dan semak semula.",database:"Aplikasi berada dalam talian tetapi pangkalan data tidak tersedia. Buka butiran pemasangan Cloudflare dan pastikan ikatan DB serta migrasi berjaya.",ready:"Aplikasi sedia untuk pentadbir pertama.",configured:"Pentadbir pertama sudah wujud. Kod persediaan telah dipadamkan.",invalid:"Masukkan alamat HTTPS workers.dev yang sah.",copyCode:"Salin kod persediaan",openApp:"Buka aplikasi kompeni",created:"Saya telah mencipta pentadbir",stage2Title:"Cipta pentadbir pertama",stage2Text:"Semak pemasangan kemudian buka aplikasi kompeni. Masukkan nama, e-mel yang dibenarkan, kata laluan dan kod persediaan sekali.",stage3Title:"Lengkapkan persediaan kompeni",stage3Text:"Kembali ke sini selepas mencipta pentadbir. Kami akan mengesahkan persediaan sekali guna selesai dan memadamkan kod daripada sesi pelayar ini.",confirm:"Sahkan pentadbir dicipta",finishReady:"Penciptaan pentadbir disahkan. Buka BB App untuk menerima privasi, menamakan kompeni dan mengikuti lawatan ringkas. Sekolah, Pegawai pertama dan perkongsian alamat boleh diselesaikan kemudian.",restart:"Sediakan kompeni lain"}}
let language=localStorage.getItem(LANGUAGE_KEY)||"en",state=readSession();
function readSession(){try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||"{}")}catch{return {}}}
function saveSession(){sessionStorage.setItem(SESSION_KEY,JSON.stringify(state))}
function newCode(){const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);return btoa(String.fromCharCode(...bytes)).replaceAll("+","-").replaceAll("/","_").replaceAll("=","")}
function ensureCode(){if(!state.code){state.code=newCode();saveSession()}return state.code}
function normalise(value){const candidate=new URL(value.trim());if(candidate.protocol!=="https:"||!candidate.hostname)throw new Error("invalid");candidate.hash="";candidate.search="";return candidate.origin}
function clearCode(){delete state.code;saveSession()}
function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
async function copy(value,button){await navigator.clipboard.writeText(value);const previous=button.textContent;button.textContent=translations[language].copied;setTimeout(()=>button.textContent=previous,1400)}
function setStage(stage){state.stage=stage;saveSession();render()}
function progressMarkup(t,active){return t.stages.map((label,index)=>`<li class="${index+1<active?"done":index+1===active?"active":""}"><span>${index+1<active?"✓":index+1}</span><small>${label}</small></li>`).join("")}
function render(){const t=translations[language],active=Math.min(3,Math.max(1,Number(state.stage)||1));document.documentElement.lang=language;document.querySelector("#language").value=language;document.querySelector("#journey-label").textContent=t.journey;document.querySelector("#title").textContent=t.title;document.querySelector("#intro").textContent=t.intro;document.querySelector("#safety").textContent=t.safety;document.querySelector("#footer").textContent=t.footer;document.querySelector("#progress").innerHTML=progressMarkup(t,active);const stage=document.querySelector("#stage");
if(active===1){const code=ensureCode();stage.innerHTML=`<p class="eyebrow">${t.stages[0]}</p><h2>${t.stage1Title}</h2><p>${t.stage1Text}</p><label>${t.email}<small>${t.emailHelp}</small><div class="field-row"><input id="admin-email" type="email" autocomplete="email" required value="${escapeHtml(state.email||"")}"><button class="copy" id="copy-email" type="button">${t.copy}</button></div></label><label>${t.code}<div class="field-row secret"><input id="setup-code" type="password" readonly value="${code}"><button class="copy" id="copy-code" type="button">${t.copy}</button></div></label><div class="actions"><button class="outline" id="toggle-code" type="button">${t.show}</button><button class="secondary" id="regenerate" type="button">${t.generate}</button><a class="button primary" id="deploy" href="${DEPLOY}" target="_blank" rel="noreferrer">${t.deploy}</a></div><details class="technical"><summary>${t.technical}</summary><div>${t.technicalText}</div></details>`;bindStage1(t)}
else if(active===2){stage.innerHTML=`<p class="eyebrow">${t.stages[1]}</p><h2>${t.stage2Title}</h2><p>${t.stage2Text}</p><label>${t.url}<small>${t.urlHelp}</small><input id="company-url" type="url" inputmode="url" autocomplete="url" placeholder="${t.urlPlaceholder}" value="${escapeHtml(state.url||"")}"></label><div class="actions"><button class="primary" id="check" type="button">${t.check}</button></div><p class="status" id="status" hidden role="status" aria-live="polite"></p><div class="ready-actions" id="ready-actions" hidden><button class="secondary" id="copy-ready-code" type="button">${t.copyCode}</button><a class="button" id="open-app" target="_blank" rel="noreferrer">${t.openApp}</a><button class="outline" id="administrator-created" type="button">${t.created}</button></div>`;document.querySelector("#check").onclick=()=>verify(false)}
else{stage.innerHTML=`<p class="eyebrow">${t.stages[2]}</p><h2>${t.stage3Title}</h2><p>${t.stage3Text}</p><div class="actions"><button class="primary" id="confirm" type="button">${t.confirm}</button></div><p class="status" id="status" hidden role="status" aria-live="polite"></p><div class="ready-actions" id="ready-actions" hidden><a class="button" id="open-app" target="_blank" rel="noreferrer">${t.openApp}</a><button class="secondary" id="restart" type="button">${t.restart}</button></div>`;document.querySelector("#confirm").onclick=()=>verify(true)} }
function bindStage1(t){const email=document.querySelector("#admin-email"),code=document.querySelector("#setup-code");email.oninput=()=>{state.email=email.value.trim();saveSession()};document.querySelector("#copy-email").onclick=()=>copy(email.value.trim(),document.querySelector("#copy-email"));document.querySelector("#copy-code").onclick=()=>copy(code.value,document.querySelector("#copy-code"));document.querySelector("#toggle-code").onclick=event=>{const visible=code.type==="text";code.type=visible?"password":"text";event.currentTarget.textContent=visible?t.show:t.hide};document.querySelector("#regenerate").onclick=()=>{state.code=newCode();saveSession();render()};document.querySelector("#deploy").onclick=event=>{if(!email.checkValidity()){event.preventDefault();email.reportValidity();return}state.email=email.value.trim();state.stage=2;saveSession();setTimeout(render,250)}}
async function verify(finalCheck){const t=translations[language],status=document.querySelector("#status"),ready=document.querySelector("#ready-actions");status.hidden=false;status.className="status checking";status.textContent=t.checking;ready.hidden=true;let url;try{url=normalise(document.querySelector("#company-url")?.value||state.url||"");state.url=url;saveSession()}catch{status.className="status error";status.textContent=t.invalid;return}try{const response=await fetch(`${url}/api/setup-status`,{cache:"no-store"});let result;try{result=await response.json()}catch{throw new Error("building")}if(result.database==="unavailable"||result.readiness==="database_unavailable"){status.className="status error";status.textContent=t.database;return}if(!response.ok||result.status!=="ok")throw new Error("building");if(result.setupRequired===false){clearCode();state.stage=3;state.complete=true;saveSession();if(!finalCheck){render();setTimeout(()=>showComplete(t,url),0)}else showComplete(t,url);return}if(finalCheck){status.className="status warning";status.textContent=t.ready;return}status.className="status ok";status.textContent=t.ready;ready.hidden=false;document.querySelector("#open-app").href=url;document.querySelector("#copy-ready-code").onclick=()=>copy(ensureCode(),document.querySelector("#copy-ready-code"));document.querySelector("#administrator-created").onclick=()=>setStage(3)}catch{status.className="status warning";status.textContent=t.building}}
function showComplete(t,url){const status=document.querySelector("#status"),ready=document.querySelector("#ready-actions");if(!status||!ready)return;status.hidden=false;status.className="status ok";status.textContent=t.finishReady;ready.hidden=false;document.querySelector("#open-app").href=url;const restart=document.querySelector("#restart");if(restart)restart.onclick=()=>{sessionStorage.removeItem(SESSION_KEY);state={};render()}}
document.querySelector("#language").onchange=event=>{language=event.target.value;localStorage.setItem(LANGUAGE_KEY,language);render()};render();if(state.complete&&Number(state.stage)===3)setTimeout(()=>showComplete(translations[language],state.url),0);
</script>
</body>
</html>
