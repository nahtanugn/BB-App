<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BB App Company Setup</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102a43;background:#edf3f8}*{box-sizing:border-box}body{margin:0;padding:clamp(14px,4vw,42px)}main{width:min(100%,900px);margin:auto}.hero,.wizard{background:#fff;border:1px solid #d7e2ed;border-radius:26px;box-shadow:0 24px 70px rgba(8,52,95,.1)}.hero{padding:clamp(25px,6vw,50px);display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:25px}.brand{display:flex;align-items:center;gap:15px}.brand img{width:64px;height:64px;padding:5px;border:1px solid #d7e2ed;border-radius:16px;object-fit:contain}.eyebrow{margin:0 0 6px;color:#1674d1;font-size:12px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}h1{margin:22px 0 10px;color:#08345f;font:700 clamp(35px,7vw,58px)/1.03 Georgia,serif}p{color:#607086;line-height:1.55}select,input,button,a.button{min-height:52px;border-radius:13px;font:inherit}select,input{width:100%;padding:0 14px;border:1px solid #b9cad9;background:#fff;color:#102a43}button,a.button{padding:0 18px;border:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:#1674d1;font-weight:800;text-decoration:none;cursor:pointer}.secondary{color:#08345f!important;background:#eaf3fc!important}.wizard{margin-top:18px;overflow:hidden}.progress{padding:22px 26px;border-bottom:1px solid #d7e2ed;background:#f8fbfe}.progress div{display:flex;justify-content:space-between;gap:15px;font-weight:800}.progress progress{width:100%;height:9px;margin-top:12px;accent-color:#1674d1}.steps{margin:0;padding:24px;list-style:none;display:grid;gap:14px}.step{padding:20px;border:1px solid #d7e2ed;border-radius:18px;background:#fff;display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px}.step.complete{border-color:#a9ddca;background:#f2fbf7}.step>span{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#08345f;font-weight:850}.step.complete>span{background:#157653}.step h2{margin:2px 0 7px;color:#08345f;font-size:20px}.step p{margin:0 0 13px}.step ul{padding-left:21px;color:#53677c;line-height:1.55}.actions{display:flex;flex-wrap:wrap;gap:10px}.status{margin:13px 0 0;padding:12px 14px;border-radius:11px;background:#f1f5f9;color:#52657a;font-weight:700}.status.ok{color:#0b6949;background:#eaf8f1}.status.error{color:#ad2929;background:#fff0f0}.check{display:flex;align-items:flex-start;gap:10px;margin-top:13px;color:#29445f;font-weight:700}.check input{width:21px;height:21px;min-height:0;margin:1px 0 0}.safety{margin:18px 0 0;padding:17px 20px;border-left:5px solid #e6b82f;border-radius:12px;background:#fff9e8;color:#52657a}.footer{padding:22px;text-align:center;color:#697b8d;font-size:14px}@media(max-width:680px){body{padding:10px}.hero{grid-template-columns:1fr;padding:24px 20px}.hero label{max-width:none}.steps{padding:14px}.step{grid-template-columns:36px minmax(0,1fr);padding:16px}.step>span{width:36px;height:36px}.actions>*{width:100%}}
  </style>
</head>
<body>
<main>
  <section class="hero">
    <div><div class="brand"><img src="default-bb-logo.png" onerror="this.src='https://raw.githubusercontent.com/nahtanugn/BB-App/main/public/default-bb-logo.png'" alt="Boys’ Brigade emblem"><div><p class="eyebrow">BB GUIDE</p><strong>BB App</strong></div></div><h1 id="title"></h1><p id="intro"></p></div>
    <label><span id="language-label"></span><select id="language"><option value="en">English</option><option value="zh">中文</option><option value="ms">Bahasa Malaysia</option></select></label>
  </section>
  <section class="wizard">
    <div class="progress"><div><span id="progress-label"></span><span id="progress-value"></span></div><progress id="progress" max="8" value="0"></progress></div>
    <ol class="steps" id="steps"></ol>
    <div class="footer"><button class="secondary" id="reset" type="button"></button></div>
  </section>
  <p class="safety" id="safety"></p>
</main>
<script>
const DEPLOY="https://deploy.workers.cloudflare.com/?url=https://github.com/nahtanugn/BB-App";
const STORE="bb-app-company-setup-v1",LANG="bb-app-setup-language";
const translations={
en:{title:"Set up your company",intro:"A guided, private deployment for a new BB company. No records are copied from another company.",language:"Guide language",progress:"Setup progress",reset:"Restart guide",safety:"Never enter passwords, Cloudflare tokens or the private setup code on this guide page. Enter secrets only inside Cloudflare and your own deployed BB App.",complete:"I completed this step",done:"Completed",openDeploy:"Open one-click Cloudflare deployment",check:"Check company app",openApp:"Open company app",url:"Company app address",placeholder:"https://your-company.workers.dev",checking:"Checking the app and private database…",healthy:"The app and database are available.",first:"The first administrator can now be created.",existing:"This company is already configured. Users may sign in.",failed:"The address could not be verified. Check the build and D1 binding, then try again.",steps:[
["Prepare company-owned accounts","Use a verified Cloudflare account and a GitHub account or organisation controlled by the company. Prepare the first administrator email and a private setup code of at least 16 characters."],
["Start one-click deployment","Open the official installer. It creates a separate Worker, D1 database and GitHub repository for this company."],
["Configure Cloudflare","Choose a unique Worker name. Keep the D1 binding named DB. Set ADMIN_EMAIL and SETUP_TOKEN inside Cloudflare, then start the build."],
["Wait for a successful build","Open the Cloudflare build details. Continue only when migrations and deployment finish successfully."],
["Verify the company address","Paste the new workers.dev address below. This check reads only service availability and initial-setup status."],
["Create the first administrator","Open the company app. Use the authorised email and private setup code once, then choose a strong password."],
["Finish company setup","Complete onboarding, set the company name and logo, prepare the school directory and create the first Officer account."],
["Hand over to users","Share only the company app address and each person’s temporary login. Never share the setup code or administrator password."]]},
zh:{title:"设置您的连队",intro:"为新 BB 连队提供引导式独立部署；不会复制其他连队的任何记录。",language:"指南语言",progress:"设置进度",reset:"重新开始",safety:"请勿在本指南页面输入密码、Cloudflare 令牌或私人设置代码。机密资料只应输入 Cloudflare 和您自己的 BB App。",complete:"我已完成此步骤",done:"已完成",openDeploy:"打开 Cloudflare 一键部署",check:"检查连队应用",openApp:"打开连队应用",url:"连队应用地址",placeholder:"https://your-company.workers.dev",checking:"正在检查应用和私人数据库……",healthy:"应用和数据库可用。",first:"现在可以创建第一位管理员。",existing:"此连队已经完成设置，用户可以登录。",failed:"无法验证地址。请检查构建和 D1 绑定后重试。",steps:[
["准备连队拥有的账号","使用连队控制的已验证 Cloudflare 账号及 GitHub 账号或组织。准备第一位管理员电邮和至少 16 个字符的私人设置代码。"],
["开始一键部署","打开官方安装器，为此连队建立独立 Worker、D1 数据库和 GitHub 仓库。"],
["设置 Cloudflare","选择独特 Worker 名称，D1 绑定保留为 DB；在 Cloudflare 设置 ADMIN_EMAIL 和 SETUP_TOKEN 后开始构建。"],
["等待构建成功","查看 Cloudflare 构建详情；数据库迁移和部署成功后才继续。"],
["验证连队地址","在下方粘贴新的 workers.dev 地址；检查只读取服务可用性和初始设置状态。"],
["创建第一位管理员","打开连队应用，以获授权电邮和私人设置代码完成一次性设置，并选择强密码。"],
["完成连队设置","完成启用流程、设置连队名称和标志、学校目录及第一位军官账号。"],
["交给用户使用","只分享连队应用地址及个人临时登录；切勿分享设置代码或管理员密码。"]]},
ms:{title:"Sediakan aplikasi kompeni",intro:"Penggunaan berpandu dan persendirian untuk kompeni BB baharu. Tiada rekod disalin daripada kompeni lain.",language:"Bahasa panduan",progress:"Kemajuan persediaan",reset:"Mulakan semula",safety:"Jangan masukkan kata laluan, token Cloudflare atau kod persediaan peribadi pada halaman panduan ini. Masukkan rahsia hanya dalam Cloudflare dan BB App milik kompeni.",complete:"Saya telah melengkapkan langkah ini",done:"Selesai",openDeploy:"Buka pemasangan Cloudflare satu klik",check:"Semak aplikasi kompeni",openApp:"Buka aplikasi kompeni",url:"Alamat aplikasi kompeni",placeholder:"https://your-company.workers.dev",checking:"Menyemak aplikasi dan pangkalan data persendirian…",healthy:"Aplikasi dan pangkalan data tersedia.",first:"Pentadbir pertama kini boleh dicipta.",existing:"Kompeni ini telah disediakan. Pengguna boleh mendaftar masuk.",failed:"Alamat tidak dapat disahkan. Semak binaan dan ikatan D1, kemudian cuba lagi.",steps:[
["Sediakan akaun milik kompeni","Gunakan akaun Cloudflare yang disahkan dan akaun atau organisasi GitHub yang dikawal kompeni. Sediakan e-mel pentadbir pertama dan kod persediaan peribadi sekurang-kurangnya 16 aksara."],
["Mulakan pemasangan satu klik","Buka pemasang rasmi. Ia mencipta Worker, pangkalan data D1 dan repositori GitHub berasingan untuk kompeni ini."],
["Konfigurasi Cloudflare","Pilih nama Worker unik. Kekalkan ikatan D1 sebagai DB. Tetapkan ADMIN_EMAIL dan SETUP_TOKEN dalam Cloudflare, kemudian mulakan binaan."],
["Tunggu binaan berjaya","Buka butiran binaan Cloudflare. Teruskan hanya apabila migrasi dan penggunaan selesai dengan jayanya."],
["Sahkan alamat kompeni","Tampal alamat workers.dev baharu di bawah. Semakan ini hanya membaca ketersediaan perkhidmatan dan status persediaan awal."],
["Cipta pentadbir pertama","Buka aplikasi kompeni. Gunakan e-mel yang dibenarkan dan kod persediaan sekali, kemudian pilih kata laluan kukuh."],
["Lengkapkan persediaan kompeni","Lengkapkan orientasi, tetapkan nama dan logo, sediakan direktori sekolah dan cipta akaun Pegawai pertama."],
["Serahkan kepada pengguna","Kongsi hanya alamat aplikasi dan log masuk sementara setiap pengguna. Jangan kongsi kod persediaan atau kata laluan pentadbir."]]}}
let lang=localStorage.getItem(LANG)||"en",state=JSON.parse(localStorage.getItem(STORE)||"{}"),verifiedUrl="";
const $=id=>document.getElementById(id);function save(){localStorage.setItem(STORE,JSON.stringify(state))}function normalise(v){const u=new URL(v.trim());if(u.protocol!=="https:")throw Error("https");u.hash="";return u.origin}
function render(){const t=translations[lang];document.documentElement.lang=lang;$("language").value=lang;$("title").textContent=t.title;$("intro").textContent=t.intro;$("language-label").textContent=t.language;$("progress-label").textContent=t.progress;$("reset").textContent=t.reset;$("safety").textContent=t.safety;const done=Object.values(state).filter(Boolean).length;$("progress").value=done;$("progress-value").textContent=`${done}/8`;$("steps").innerHTML=t.steps.map((s,i)=>`<li class="step ${state[i]?"complete":""}"><span>${state[i]?"✓":i+1}</span><div><h2>${s[0]}</h2><p>${s[1]}</p>${i===1?`<div class="actions"><a class="button" target="_blank" rel="noreferrer" href="${DEPLOY}">${t.openDeploy}</a></div>`:""}${i===4?`<label>${t.url}<input id="company-url" type="url" placeholder="${t.placeholder}" value="${verifiedUrl}"></label><div class="actions"><button id="check" type="button">${t.check}</button><a id="open-app" class="button secondary" hidden target="_blank" rel="noreferrer">${t.openApp}</a></div><p class="status" id="status" hidden></p>`:""}<label class="check"><input type="checkbox" data-step="${i}" ${state[i]?"checked":""}><span>${state[i]?t.done:t.complete}</span></label></div></li>`).join("");document.querySelectorAll("[data-step]").forEach(el=>el.onchange=()=>{state[el.dataset.step]=el.checked;save();render()});const check=$("check");if(check)check.onclick=verify}
async function verify(){const t=translations[lang],status=$("status"),open=$("open-app");status.hidden=false;status.className="status";status.textContent=t.checking;open.hidden=true;try{verifiedUrl=normalise($("company-url").value);const response=await fetch(`${verifiedUrl}/api/setup-status`,{cache:"no-store"});const result=await response.json();if(!response.ok||result.status!=="ok")throw Error("unavailable");status.className="status ok";status.textContent=`${t.healthy} ${result.setupRequired?t.first:t.existing}`;open.href=verifiedUrl;open.hidden=false;state[4]=true;save();$("progress").value=Object.values(state).filter(Boolean).length;$("progress-value").textContent=`${$("progress").value}/8`}catch{status.className="status error";status.textContent=t.failed}}
$("language").onchange=e=>{lang=e.target.value;localStorage.setItem(LANG,lang);render()};$("reset").onclick=()=>{state={};save();render()};render();
</script>
</body></html>
