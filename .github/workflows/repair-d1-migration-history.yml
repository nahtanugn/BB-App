name: Repair D1 migration history

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: This only baselines an already-populated production database
        required: true
        type: choice
        default: inspect-only
        options:
          - inspect-only
          - record-existing-history

permissions:
  contents: read

concurrency:
  group: production-web
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate database configuration
        run: |
          test -n "$D1_DATABASE_NAME"
          test -n "$D1_DATABASE_ID"
          node scripts/create-wrangler-config.mjs
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - name: Verify this is the existing application database
        id: schema
        run: |
          schema=$(pnpm exec wrangler d1 execute "$D1_DATABASE_NAME" --remote --config .wrangler/deployment.json --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('award_definitions', 'members', 'users', 'automation_action_items', 'company_events', 'attendance_qr_codes', 'import_job_rows', 'parade_plans', 'app_branding', 'company_statistics', 'associates_and_alumni', 'classification_transfers') ORDER BY name" --json)
          echo "$schema"
          for table in award_definitions members users automation_action_items company_events attendance_qr_codes import_job_rows parade_plans app_branding company_statistics associates_and_alumni classification_transfers; do
            echo "$schema" | grep -q "\"$table\""
          done

          member_columns=$(pnpm exec wrangler d1 execute "$D1_DATABASE_NAME" --remote --config .wrangler/deployment.json --command "SELECT name FROM pragma_table_info('members') WHERE name IN ('gender', 'ethnicity', 'religion', 'spiritual_status') ORDER BY name" --json)
          echo "$member_columns"
          for column in gender ethnicity religion spiritual_status; do
            echo "$member_columns" | grep -q "\"$column\""
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      - name: Record only the already-present migration history
        if: inputs.confirmation == 'record-existing-history'
        run: |
          pnpm exec wrangler d1 execute "$D1_DATABASE_NAME" --remote --config .wrangler/deployment.json --command "CREATE TABLE IF NOT EXISTS d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL)"
          history=$(pnpm exec wrangler d1 execute "$D1_DATABASE_NAME" --remote --config .wrangler/deployment.json --command "SELECT COUNT(*) AS count FROM d1_migrations" --json)
          echo "$history"
          if ! echo "$history" | grep -Eq '"count"[[:space:]]*:[[:space:]]*0([^0-9]|$)'; then
            echo "Migration history is already present; refusing to change it."
            exit 1
          fi
          for migration in $(find drizzle -maxdepth 1 -type f -name '00*.sql' -print | sort); do
            name="$(basename "$migration")"
            case "$name" in
              0039_*) break ;;
            esac
            pnpm exec wrangler d1 execute "$D1_DATABASE_NAME" --remote --config .wrangler/deployment.json --command "INSERT INTO d1_migrations (name) VALUES ('$name')"
          done
          pnpm exec wrangler d1 execute "$D1_DATABASE_NAME" --remote --config .wrangler/deployment.json --command "SELECT name FROM d1_migrations ORDER BY id"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
