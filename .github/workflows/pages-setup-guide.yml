name: Publish setup guide

on:
  push:
    branches: [main]
    paths:
      - "docs/setup/**"
      - ".github/workflows/pages-setup-guide.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare setup guide
        run: |
          mkdir -p .pages/setup
          cp -R docs/setup/. .pages/setup/
          cp public/default-bb-logo.png .pages/setup/default-bb-logo.png
          cat > .pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0;url=./setup/">
            <title>BB App Company Setup</title>
          </head>
          <body><p><a href="./setup/">Open the BB App company setup guide</a></p></body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Deploy setup guide
        id: deployment
        uses: actions/deploy-pages@v4
