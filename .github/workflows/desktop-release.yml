name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-base-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generic distribution
        run: pnpm test

  build-desktop:
    needs: validate-base-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            rust-targets: ""
          - platform: windows-latest
            args: "--bundles nsis,msi"
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish desktop installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "BB App Base v__VERSION__"
          releaseBody: |
            Generic base edition of BB App for macOS, Windows and Linux.

            On first launch, enter the web address supplied by your company administrator. The installer contains no company-specific branding, live database, member records, credentials or deployment address.

            ## Important notice for Mac users

            The macOS DMGs are not Apple-signed or notarized. After dragging **BB App** into **Applications**, macOS may say that the app is damaged and may not show **Open Anyway**. Confirm that the DMG came from this official release, then open Terminal and run:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/BB App.app"
            ```

            Then open BB App from Applications. This command removes the download quarantine only from this BB App installation. Do not use it for software obtained from an untrusted source.

            Windows installers are also unsigned and Microsoft Defender SmartScreen may display a warning.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          releaseAssetNamePattern: "BB-App-Base-[version]-[platform]-[arch][setup].[ext]"
          args: ${{ matrix.args }}
