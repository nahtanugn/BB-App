name: Production health check

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        id: health
        continue-on-error: true
        run: |
          test -n "$APP_URL"
          status="$(curl --silent --show-error --output health.json --write-out '%{http_code}' --max-time 20 "$APP_URL/api/health")"
          test "$status" = "200"
          grep -q '"status":"ok"' health.json
        env:
          APP_URL: ${{ vars.APP_URL }}

      - name: Open or update health incident
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Production health check failed"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="The automated production health check could not confirm that the app and database were available at $(date -u +'%Y-%m-%d %H:%M UTC'). Review the latest deployment and Cloudflare logs. No member data was collected."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug
          fi

      - name: Confirm health
        if: steps.health.outcome == 'failure'
        run: exit 1
