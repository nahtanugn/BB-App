name: Deploy web app

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type of run
        required: true
        type: choice
        default: validate-only
        options:
          - validate-only
          - deploy-production

permissions:
  contents: read

concurrency:
  group: production-web
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  deploy:
    needs: validate
    if: inputs.approval == 'deploy-production'
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment configuration
        run: |
          test -n "$APP_URL"
          test -n "$ADMIN_EMAIL"
          test -n "$WORKER_NAME"
          test -n "$D1_DATABASE_NAME"
          test -n "$D1_DATABASE_ID"
          node scripts/create-wrangler-config.mjs
      - run: pnpm build
      - name: Apply additive migrations
        run: pnpm exec wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config .wrangler/deployment.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy verified build
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 "$APP_URL/api/health" | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
